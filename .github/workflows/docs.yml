name: Documentation tests

on:
  schedule:
    - cron: '25 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      key: ${{ steps.check.outputs.key }}
    steps:
      - id: check
        uses: ArchiveBox/monorepo/.github/actions/changed-scheduled-inputs@main

  documentation:
    permissions:
      actions: read
      contents: read
      id-token: write
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - name: Set up Squid
      if: >-
        github.repository == 'ArchiveBox/abxpkg' && github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      uses: ArchiveBox/monorepo/.github/actions/setup-squid@a877c13fc6db20e06f87aaef34502ab3c7f57e41
      with:
        proxy: ${{ vars[runner.environment == 'self-hosted' && 'SQUID_LAN_URL' || 'SQUID_TAILNET_URL'] }}
        ca: ${{ vars.SQUID_CA }}
        tailscale-client-id: ${{ vars.SQUID_TAILSCALE_CLIENT_ID }}
        tailscale-audience: ${{ vars.SQUID_TAILSCALE_AUDIENCE }}

    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: "0.13.5"
        enable-cache: false
        cache-dependency-glob: "pyproject.toml"

    - name: Setup venv and install pip dependencies
      run: |
        uv venv --python "3.12"
        uv sync --all-extras --all-groups --no-cache

    - name: Run live documentation code blocks
      run: uv run pytest -vv --tb=long -m live_required README.md django_example_project/README.md AGENTS.md skills docs

    - name: Run documentation code blocks
      run: uv run pytest -vv --tb=long -m "not live_required" README.md django_example_project/README.md AGENTS.md skills docs

  complete:
    name: 'Scheduled inputs: ${{ needs.changes.outputs.key }}'
    needs: [changes, documentation]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Scheduled work completed successfully.'
