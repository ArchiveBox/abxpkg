name: Run Tests

on:
  schedule:
    - cron: '11 2,10,18 * * *'
  pull_request:
    branches: [ "main" ]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Coverage platform
        type: choice
        default: linux
        options: [linux, macos]

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  precheck:
    if: github.event_name != 'schedule' && inputs.platform != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: "0.10.6"
        enable-cache: false
        cache-dependency-glob: "pyproject.toml"

    - name: Setup venv and install pip dependencies
      run: |
        uv venv --python "3.12" \
        && uv sync --all-extras --all-groups --no-cache

    - name: Run pre-commit checks
      run: uv run prek run --all-files --show-diff-on-failure


  discover-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tests: ${{ steps.set-matrix.outputs.tests }}
      runner: ${{ steps.runner.outputs.use-runner || '["ubuntu-24.04"]' }}
      run_tests: ${{ steps.gate.outputs.run_tests }}
      platform: ${{ steps.gate.outputs.platform }}
      scheduled_key: ${{ steps.changes.outputs.key }}

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Check scheduled macOS inputs
      id: changes
      if: github.event_name == 'schedule' || inputs.platform == 'macos'
      uses: ArchiveBox/monorepo/.github/actions/changed-scheduled-inputs@main

    - name: Select coverage cadence
      id: gate
      env:
        MACOS: ${{ github.event_name == 'schedule' || inputs.platform == 'macos' }}
        CHANGED: ${{ steps.changes.outputs.changed }}
      run: |
        if [[ "$MACOS" == true ]]; then
          echo 'platform=macos' >> "$GITHUB_OUTPUT"
          echo "run_tests=$CHANGED" >> "$GITHUB_OUTPUT"
        else
          echo 'platform=linux' >> "$GITHUB_OUTPUT"
          echo 'run_tests=true' >> "$GITHUB_OUTPUT"
        fi

    - name: Select available CI capacity
      id: runner
      if: steps.gate.outputs.run_tests == 'true' && steps.gate.outputs.platform == 'linux' && vars.UGNAS_CI_ENABLED != 'false' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      uses: ArchiveBox/monorepo/.github/actions/select-ci-runner@main
      with:
        github-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: "0.10.6"
        enable-cache: false

    - name: Discover test files
      id: set-matrix
      if: steps.gate.outputs.run_tests == 'true'
      env:
        CI_TEST_PLATFORM: ${{ steps.gate.outputs.platform }}
        UGNAS_CI_MAX_JOBS: ${{ vars.UGNAS_CI_MAX_JOBS || 3 }}
      run: |
        uv run --no-project python .github/test_ci_test_matrix.py
        uv run --no-project python .github/ci_test_matrix.py >> "$GITHUB_OUTPUT"

  tests:
    name: ${{ matrix.test.os_name }} py${{ matrix.test.python_version }} ${{ matrix.test.name }}
    needs: discover-tests
    if: needs.discover-tests.outputs.run_tests == 'true'
    runs-on: ${{ matrix.test.ugnas && fromJSON(needs.discover-tests.outputs.runner) || matrix.test.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.discover-tests.outputs.tests) }}

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.test.python_version }}
   
    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: "0.10.6"
        enable-cache: false

    - name: Set up Go for CLI installer coverage
      if: matrix.test.name == 'cli'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.25.0'
        cache: false

    - name: Setup venv and install pip dependencies
      run: |
        echo "ABXPKG_LIB_DIR=$RUNNER_TEMP/abxpkg-tests-${{ github.run_id }}-${{ matrix.test.name }}" >> "$GITHUB_ENV"
        uv venv --python "${{ matrix.test.python_version }}"
        uv sync --all-extras --no-cache

    - name: Run discovered test file
      env:
        TEST_PATH: ${{ matrix.test.path }}
        TEST_WORKERS: ${{ matrix.test.name == 'cli' && !matrix.test.ugnas && matrix.test.os_name == 'linux' && 4 || 0 }}
      run: |
        if [[ "$TEST_WORKERS" != 0 ]]; then
          # This CLI test measures sub-100ms wall-clock startup. Concurrent
          # package installs from other xdist workers measure CPU contention
          # instead, so run it alone, then run every remaining case in parallel.
          startup_test=test_warm_run_uses_cached_exec_plan_without_loading_cli_frameworks
          uv run pytest -vv --tb=long "$TEST_PATH::$startup_test"
          uv run pytest -vv --tb=long -n "$TEST_WORKERS" "$TEST_PATH" -k "not $startup_test"
        else
          uv run pytest -vv --tb=long "$TEST_PATH"
        fi

  package:
    # Build concurrently; release.yml still requires this entire workflow green.
    if: github.event_name != 'schedule' && inputs.platform != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: "0.10.6"
        enable-cache: false

    - name: Build and validate distributions
      run: |
        uv build --out-dir dist
        uv publish --dry-run --trusted-publishing never dist/*.whl dist/*.tar.gz
        uv run --no-project python - <<'PY' > dist/SHA256SUMS
        from hashlib import sha256
        from pathlib import Path

        dist = Path("dist")
        artifacts = sorted((*dist.glob("*.whl"), *dist.glob("*.tar.gz")))
        if len(list(dist.glob("*.whl"))) != 1 or len(list(dist.glob("*.tar.gz"))) != 1:
            raise SystemExit(f"Expected one wheel and one sdist, found: {artifacts}")
        for artifact in artifacts:
            print(f"{sha256(artifact.read_bytes()).hexdigest()}  {artifact.name}")
        PY

    - name: Upload tested distributions
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: abxpkg-dist-${{ github.sha }}
        path: |
          dist/*.whl
          dist/*.tar.gz
          dist/SHA256SUMS
        if-no-files-found: error
        retention-days: 90

  scheduled-complete:
    name: 'Scheduled inputs: ${{ needs.discover-tests.outputs.scheduled_key }}'
    needs: [discover-tests, tests]
    if: needs.discover-tests.outputs.run_tests == 'true' && needs.discover-tests.outputs.platform == 'macos'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Scheduled macOS coverage completed successfully.'
