name: Release

on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]
    branches:
      - main

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      actions: read
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_BRANCH: main
      REQUIRED_TEST_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.10.6"
          enable-cache: false

      - name: Record verified release
        id: release
        run: |
          set -Eeuo pipefail
          VERSION="$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml | head -n 1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish tested commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        run: ./bin/release.sh

  cascade:
    name: Cascade verified release
    needs: publish
    permissions:
      contents: read
    uses: ArchiveBox/monorepo/.github/workflows/cascade-release.yml@main
    with:
      upstream_package: abxpkg
      upstream_version: ${{ needs.publish.outputs.version }}
    secrets:
      release_token: ${{ secrets.RELEASE_GH_TOKEN }}
