name: Publish website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # Repository-specific output; all publication logic below is a local copy.
  SITE_OUTPUT: _site
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

# One production queue covers restore, build and deploy. PRs have separate queues.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || env.DEFAULT_BRANCH }}
          persist-credentials: false
      - name: Record website source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # BEGIN REPOSITORY-SPECIFIC BUILD
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.10.6"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install project
        run: uv sync --all-extras --no-cache

      - name: Render landing page
        run: |
          uv run --no-sync pytest -xq tests/test_docs.py
          uv run --no-sync python docs/generate.py
      # END REPOSITORY-SPECIFIC BUILD

      - name: Verify website in Chromium
        run: |
          uv run --no-config --no-project --with playwright==1.63.0 playwright install --with-deps chromium
          uv run --no-config --no-project --with playwright==1.63.0 python .github/pages/verify.py "$SITE_OUTPUT" --evidence "$RUNNER_TEMP/site-evidence"
      - name: Save website verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-verification
          path: ${{ runner.temp }}/site-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_OUTPUT }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only the current default-branch revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          echo "deploy=$([ "$latest" = "$REVISION" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.deploy == 'true'
        id: deployment
